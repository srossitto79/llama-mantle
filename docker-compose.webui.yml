services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    volumes:
      - /mnt/f/open-webui-data:/app/backend/data
    environment:
      OPENAI_BASE_URL: http://llama-swap:8080/v1
      WEBUI_SECRET_KEY: ""
    restart: unless-stopped
    depends_on:
      - llama-swap
